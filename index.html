<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>テリヤ発注</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif;background:#f1f5f9;color:#0f172a}.app{max-width:1000px;margin:auto;padding:10px}.card{background:#fff;border-radius:16px;padding:10px;box-shadow:0 2px 12px #0001}.top{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:10px}h1{font-size:26px;margin:0}.hint{font-size:15px;color:#64748b;font-weight:600}.actions{display:flex;gap:8px;flex-wrap:wrap}button{border:0;border-radius:12px;font-weight:800;touch-action:manipulation}.action{padding:12px 15px;font-size:16px}.hide{background:#e2e8f0}.hide.on{background:#059669;color:#fff}.shot{background:#1d4ed8;color:white}.clear{background:#ffe4e6;color:#be123c}.wrap{overflow-x:auto;border:2px solid #64748b;border-radius:12px}table{width:100%;min-width:690px;border-collapse:collapse;text-align:center;font-weight:800}th,td{border:1px solid #cbd5e1}.name{background:#f8fafc;text-align:left;padding:5px 9px;font-size:19px}.no,.size{font-size:22px;padding:5px}.size{background:#fffbeb}.head{background:#1e293b;color:white;font-size:19px;padding:9px}.uni{background:#f59e0b}.blue{background:#1d4ed8}.white{background:#475569}.sub{color:white;font-size:18px;padding:7px}.qtycell{padding:3px}.qty{width:100%;height:46px;min-width:66px;font-size:27px;background:#f1f5f9;color:#94a3b8}.qty.has.blueq{background:#2563eb;color:#fff}.qty.has.whiteq{background:#334155;color:#fff}.total th,.total td{background:#fde68a;font-size:25px;padding:8px}.foot{margin-top:10px;padding:10px;border-radius:10px;background:#eff6ff;color:#1e3a8a;font-weight:700;font-size:14px}.shotmode{background:#fff}.shotmode .controls,.shotmode .foot{display:none}.shotTitle{display:none;text-align:center;font-size:21px;font-weight:900;margin:2px 0 8px}.shotmode .shotTitle{display:block}.shotmode .card{box-shadow:none}.shotmode .qty{pointer-events:none}.returnNote{display:none;text-align:center;color:#94a3b8;font-size:12px;margin-top:7px}.shotmode .returnNote{display:block}@media(max-width:760px){.app{padding:4px}.card{border-radius:8px;padding:5px}h1{font-size:22px}.qty{height:43px;font-size:25px}.name{font-size:17px}.no,.size{font-size:20px}}
</style>
</head>
<body><div class="app" id="app"><div class="card"><div class="top controls"><div><h1>🛒 テリヤ発注</h1><div class="hint">数量をタップ：0 → 1 → 2 → 3 → 4 → 5 → 0</div></div><div class="actions"><button id="hide" class="action hide">名前を非表示</button><button id="shot" class="action shot">📷 スクショモード</button><button id="clear" class="action clear">今回の注文をクリア</button></div></div><div class="shotTitle">テリヤ 発注表</div><div class="wrap"><table><thead><tr id="h1"><th rowspan="2" class="head nameCol">名前</th><th rowspan="2" class="head">背番号</th><th rowspan="2" class="head uni">ユニ<br>サイズ</th><th colspan="2" class="head blue">ソックス青</th><th colspan="2" class="head white">ソックス白</th></tr><tr><th class="sub blue">19〜21</th><th class="sub blue">22〜24</th><th class="sub white">19〜21</th><th class="sub white">22〜24</th></tr></thead><tbody id="body"></tbody><tfoot><tr class="total"><th class="nameCol">合計</th><td></td><td></td><td id="t0">0</td><td id="t1">0</td><td id="t2">0</td><td id="t3">0</td></tr></tfoot></table></div><div class="foot controls">入力内容はこの端末のブラウザに自動保存します。送信時は「名前を非表示」→「📷 スクショモード」。</div><div class="returnNote">画面の余白をダブルタップすると編集画面に戻ります</div></div></div>
<script>
const members=[["さくら",2,"160"],["はるき",3,"160"],["こりく",4,"160"],["つかさ",5,"S"],["こうた",6,"S"],["こうせい",8,"S"],["さりく",9,"160"],["ゆうま",10,"160"],["あお",11,"160"],["ひなの",13,"160"],["こうたろう",14,"S"]];
let q=members.map(()=>[0,0,0,0]);try{const s=localStorage.getItem('teriya-order-v1');if(s)q=JSON.parse(s)}catch(e){}
let hidden=false,shot=false;const body=document.getElementById('body'),app=document.getElementById('app');
function save(){try{localStorage.setItem('teriya-order-v1',JSON.stringify(q))}catch(e){}}
function render(){body.innerHTML='';members.forEach((m,r)=>{const tr=document.createElement('tr');if(!hidden){const th=document.createElement('th');th.className='name nameCol';th.textContent=m[0];tr.appendChild(th)};tr.innerHTML+=`<td class="no">${m[1]}</td><td class="size">${m[2]}</td>`;q[r].forEach((v,c)=>{const td=document.createElement('td');td.className='qtycell';const b=document.createElement('button');b.className='qty'+(v?' has '+(c<2?'blueq':'whiteq'):'');b.textContent=v;b.disabled=shot;b.onclick=()=>{q[r][c]=(q[r][c]+1)%6;save();render()};td.appendChild(b);tr.appendChild(td)});body.appendChild(tr)});document.querySelectorAll('.nameCol').forEach(el=>el.style.display=hidden?'none':'');[0,1,2,3].forEach(c=>document.getElementById('t'+c).textContent=q.reduce((s,row)=>s+(row[c]||0),0));document.getElementById('hide').textContent=hidden?'名前：非表示 ✓':'名前を非表示';document.getElementById('hide').classList.toggle('on',hidden);app.classList.toggle('shotmode',shot)}
document.getElementById('hide').onclick=()=>{hidden=!hidden;render()};document.getElementById('shot').onclick=()=>{shot=true;render()};document.getElementById('clear').onclick=()=>{if(confirm('今回の注文数量をすべて0に戻しますか？')){q=members.map(()=>[0,0,0,0]);save();render()}};document.body.ondblclick=()=>{if(shot){shot=false;render()}};render();
</script></body></html>
